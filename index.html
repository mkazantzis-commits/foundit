/* Physical foil and touch-life pass. */
:root{--shine-x:50%;--shine-y:28%}

.camera{animation:cameraBreathe 2.4s ease-in-out infinite}.bookPull{animation:bookBob 2.8s ease-in-out infinite}.go{animation:goFloat 2s ease-in-out infinite}.packChip.current{animation:packNudge 2.6s ease-in-out infinite}

function dailyIndex(){let d=new Date(),key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),n=[...key].reduce((a,c)=>a+c.charCodeAt(0),0);return{key,index:n%species.length}}
function art(i,src){return '<img src="'+(src||ART_IMAGES[i])+'" alt="'+species[i].name+'">'}
function render(){let o=species[current],f=book()[current],d=dailyIndex(),isDaily=bonus&&current===d.index,rar=rarityOf(current),tier=tierFor(current);$('#deck').querySelectorAll('.card').forEach(x=>x.remove());let c=document.createElement('article');c.className='card '+rar+(f?' found':(current===0?' unfound starterCard':' unfound'));c.dataset.index=current;c.style.setProperty('--accent',accent(current));c.innerHTML='<div class="cardShell"><div class="face front"><i class="cardShine" aria-hidden="true"></i>'+(f?'<div class="foundFlag">'+currentPlayer.toUpperCase()+' FOUND IT!</div>':'')+(isDaily?'<div class="dailyFlag">TODAY ✦</div>':'')+(tier?'<span class="medal '+tier+'">'+tier.toUpperCase()+'</span>':'')+'<span class="rarityTag">'+rar.toUpperCase()+'</span>'+'<div class="artPlate">'+art(current,f&&f.photo)+'</div><div class="identity"><span class="number">'+String(current+1).padStart(2,'0')+'/50</span><h1 class="name">'+o.name+'</h1></div></div><div class="face back"><div><div class="backMark">NO WAY! • '+String(current+1).padStart(2,'0')+'</div><div class="backArt">'+art(current)+'</div><h2>'+o.name+'</h2><div class="fact">'+facts[current]+'</div></div><button class="findBtn"><span class="findLens">◎</span><span>FOUND IT!</span></button></div></div>';
$('#deck').appendChild(c);bindCard(c);c.querySelector('.findBtn').onclick=e=>{e.stopPropagation();$('#camera').click()};$('#score').textContent=Object.keys(book()).length;document.documentElement.style.setProperty('--now',accent(current));}
function next(dir){let live=liveList(),pos=live.indexOf(current);current=live[(pos+dir+live.length)%live.length];bonus=false;render()}
function setCardTilt(c,dx,dy,dragging=true){let rx=Math.max(-14,Math.min(14,-dy/11)),ry=Math.max(-17,Math.min(17,dx/9));c.style.setProperty('--tilt-x',ry.toFixed(1));c.style.setProperty('--shine-x',(50+ry*2.4)+'%');c.style.setProperty('--shine-y',(44-rx*2.2)+'%');c.style.setProperty('--shine-x-num',(50+ry*2.4).toFixed(1));c.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+Math.min(100,Math.max(-130,dy))+'px)) perspective(900px) rotateX('+rx+'deg) rotateY('+ry+'deg) rotateZ('+dx/30+'deg) scale('+(dragging?1.025:1)+')'}
function settleCard(c){c.classList.remove('tilting');c.classList.add('settling');c.style.transform='';c.style.setProperty('--shine-x','50%');c.style.setProperty('--shine-y','28%');c.style.setProperty('--shine-x-num','50');setTimeout(()=>c.classList.remove('settling'),650)}
function bindCard(c){c.onpointerdown=e=>{if(e.target.closest('button'))return;c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};c.classList.add('tilting');c.style.transition='none';setCardTilt(c,0,0)};c.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>5||Math.abs(dy)>5)drag.moved=true;setCardTilt(c,dx,dy)};c.onpointerup=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y,dt=Math.max(1,performance.now()-drag.t),vx=dx/dt,m=drag.moved;drag=null;c.classList.remove('tilting');c.style.transition='';if(dy>105&&Math.abs(dy)>Math.abs(dx)){c.style.transform='translate(-50%,120vh) perspective(900px) rotateX(-12deg) rotateZ(8deg)';setTimeout(openBook,180);return}if(Math.abs(dx)>75||Math.abs(vx)>.55){let dir=dx<0?1:-1;c.style.transform='translate('+(dx<0?'-170vw':'70vw')+',-50%) perspective(900px) rotateY('+(dx<0?'-24':'24')+'deg) rotateZ('+(dx<0?'-18':'18')+'deg)';c.style.opacity='0';if(navigator.vibrate)navigator.vibrate(10);setTimeout(()=>next(dir),210)}else{settleCard(c);if(!m)c.classList.toggle('flipped')}};c.onpointercancel=()=>{drag=null;settleCard(c)}}
function openBook(filter=bookFilter){bookFilter=filter;renderBook();$('#grid').scrollTop=0;$('#book').classList.add('open')} function closeBook(){$('#book').classList.remove('open');render()}
function renderBook(){let b=book(),indices=bookFilter===null?species.map((_,i)=>i):species.map((_,i)=>i).filter(i=>packFor(i)===bookFilter);$('#bookCount').textContent=(bookFilter===null?'ALL · ':PACKS[bookFilter].name+' · ')+indices.length+' CARDS';renderProgress();$$('.switch button').forEach(x=>x.classList.toggle('on',x.dataset.player===currentPlayer));$('#grid').innerHTML=indices.map(i=>{let o=species[i],f=b[i],tier=tierFor(i),holo=rarityOf(i)!=='common'||Object.values(state.holos).includes(i);return '<button class="slot '+(f?'found ':'ghostCard ')+(holo?'holo ':'')+'" data-i="'+i+'" style="--accent:'+accent(i)+'">'+(tier?'<span class="tier '+tier+'">'+tier.toUpperCase()+'</span>':'')+'<div class="slotArt">'+art(i,f&&f.photo)+'</div><div class="slotName">'+o.name+'</div></button>'}).join('');$$('.slot').forEach(x=>x.onclick=()=>{current=+x.dataset.i;bonus=false;closeBook()})}
function renderProgress(){let active=bookFilter;$('#homePacks').innerHTML=PACKS.map((p,i)=>'<button class="packChip '+(i===active?'current':'')+'" data-pack="'+i+'" title="'+p.name+'"><span class="packIcon">'+p.icon+'</span></button>').join('');$('#packShelf').innerHTML=PACKS.map((p,i)=>'<button class="packTile '+(i===active?'active':'')+'" data-pack="'+i+'"><i>'+p.icon+'</i><span class="packLabel">'+p.name+'</span></button>').join('');let set=SETS.find(x=>!state.holos[x.name])||SETS[0],earned=!!state.holos[set.name],got=set.ids.filter(i=>book()[i]).length;$('#setStrip').innerHTML='<b><small>COLLECTIBLE SET</small>✦ '+set.name+'<em>'+got+'/'+set.ids.length+' → HOLO</em></b><span class="setDots">'+set.ids.map(i=>'<i class="'+(book()[i]?'on':'lockedPiece')+'">'+(book()[i]?'✓':art(i))+'</i>').join('')+'<i class="setReward '+(earned?'holo':'locked')+'">'+(earned?'✦':'?')+'</i></span>';$('#dailyText').textContent=state.dailyClaims[dailyIndex().key]?'CLAIMED ✓':'ONE SHINY FIND';$('#questText').textContent=QUESTS[state.quest.index%QUESTS.length].short+(state.quest.done?' ✓':'');$$('.packTile').forEach(x=>x.onclick=()=>{bookFilter=+x.dataset.pack;renderBook();$('#grid').scrollTop=0});$$('.packChip').forEach(x=>x.onclick=()=>{bookFilter=+x.dataset.pack;openBook(bookFilter)})}
function renderQuest(){let q=QUESTS[state.quest.index%QUESTS.length];$('#questPrompt').textContent=q.short;$('#questTitle').textContent=state.quest.done?'QUEST COMPLETE!':'SIDE QUEST';$('#questSteps').innerHTML=Array.from({length:q.goal},(_,i)=>'<i class="'+(i<state.quest.progress?'done':'')+'">'+(i<state.quest.progress?'✓':i+1)+'</i>').join('');$('#questAdd').textContent=state.quest.done?'DONE ✓':'FOUND ONE ✓'}
function openQuest(){renderQuest();$('#questOverlay').classList.add('on');blip()}
function showPayoff(type,data={}){let panel=$('#payoffArt');panel.className='payoffArt '+(type==='holo'?'holo':'');if(type==='pack'){panel.innerHTML='<span class="bigIcon">'+data.icon+'</span>';$('#payoffTitle').textContent=data.name+'!';$('#payoffCopy').textContent='NEW PACK UNLOCKED'}else if(type==='holo'){panel.innerHTML='<span class="bigIcon">✦</span>';$('#payoffTitle').textContent='HOLO CARD!';$('#payoffCopy').textContent=data.name+' SET COMPLETE'}else{panel.innerHTML=art(data.index);$('#payoffTitle').textContent=(type==='legendary'?'LEGENDARY!':'RARE FIND!');$('#payoffCopy').textContent=species[data.index].name.toUpperCase()}$('#payoff').classList.add('on');blip();if(navigator.vibrate)navigator.vibrate([80,40,80,40,180]);confetti()}
function checkRewards(){for(let set of SETS){if(!state.holos[set.name]&&set.ids.every(i=>book()[i])){let id=50+Object.keys(state.holos).length;state.holos[set.name]=id;save();setTimeout(()=>showPayoff('holo',{name:set.name}),250);return true}}return false}
function blip(){try{let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(420,a.currentTime);o.frequency.exponentialRampToValueAtTime(760,a.currentTime+.11);g.gain.setValueAtTime(.055,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.17)}catch(e){}}function setPlayer(p){currentPlayer=p;save();$$('.who button').forEach(x=>x.classList.toggle('on',x.dataset.player===p));render();renderBook()}$$('.who button').forEach(x=>x.onclick=()=>{setPlayer(x.dataset.player);blip()});$('#homeDaily').onclick=()=>{current=dailyIndex().index;if(!isUnlocked(current))current=liveList()[0];bonus=true;$('#home').classList.add('gone');$('#game').classList.add('started');render();toast('DAILY BONUS ✦')};$('#homeQuest').onclick=openQuest;$('#questClose').onclick=()=>$('#questOverlay').classList.remove('on');$('#questAdd').onclick=()=>{if(state.quest.done)return;state.quest.progress=Math.min(QUESTS[state.quest.index].goal,state.quest.progress+1);state.quest.done=state.quest.progress>=QUESTS[state.quest.index].goal;save();renderQuest();renderProgress();blip()};$('#questNext').onclick=()=>{state.quest={index:(state.quest.index+1)%QUESTS.length,progress:0,done:false};save();renderQuest();renderProgress();blip()};setPlayer(currentPlayer);$('#go').onclick=()=>{$('#home').classList.add('gone');$('#game').classList.add('started');blip();if(navigator.vibrate)navigator.vibrate(18)};$('#logoMark').onclick=()=>{$('#home').classList.remove('gone');$('#game').classList.remove('started')};$('#closeBook').onclick=closeBook;$('#bookPull').onclick=openBook;$$('.switch button').forEach(x=>x.onclick=()=>{setPlayer(x.dataset.player);blip()});$('#daily').onclick=()=>{current=dailyIndex().index;bonus=true;render();toast('TODAY ✦')};
let pullY=null;$('#game').addEventListener('pointerdown',e=>{if(e.target.closest('.card,.camera,.player,.dailyOrb,.overlay,.book'))return;pullY=e.clientY});$('#game').addEventListener('pointerup',e=>{if(pullY!==null&&e.clientY-pullY>70)openBook();pullY=null});
$('#camera').onchange=async e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);$('#scanPhoto').src=url;$('#scan').classList.add('on');lastPhoto=await compress(f);$('#confirmPhoto').src=lastPhoto;setTimeout(()=>{$('#scan').classList.remove('on');$('#confirmName').textContent=species[current].name+'?';$('#confirm').classList.add('on')},1000)};
function compress(f){return new Promise(res=>{let im=new Image;im.onload=()=>{let m=1000,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=URL.createObjectURL(f)})}
$('#approve').onpointerdown=()=>{$('#approve').classList.add('holding');holdTimer=setTimeout(approve,1200)};['pointerup','pointercancel','pointerleave'].forEach(k=>$('#approve').addEventListener(k,()=>{clearTimeout(holdTimer);$('#approve').classList.remove('holding')}));$('#retake').onclick=()=>{$('#confirm').classList.remove('on');$('#camera').value='';$('#camera').click()};
function approve(){clearTimeout(holdTimer);let lm=$('#logoMark');lm.classList.remove('hit');void lm.offsetWidth;lm.classList.add('hit');let b=book();b[current]={at:Date.now(),bonus,photo:lastPhoto,approvedBy:'Michael',rarity:rarityOf(current)};if(!state.first[current])state.first[current]=currentPlayer;if(bonus)state.dailyClaims[dailyIndex().key]=current;save();$('#confirm').classList.remove('on');let tier=tierFor(current),rar=rarityOf(current);$('#revealCard').className='revealCard '+rar+' '+tier;$('#revealCard').innerHTML=art(current,lastPhoto)+(tier?'<span class="medal '+tier+'">'+tier.toUpperCase()+'</span>':'');$('#revealName').textContent='FOUND IT!';$('#revealCopy').textContent=species[current].name+' • '+currentPlayer.toUpperCase()+(bonus?' • ✦':'')+(state.first[current]===currentPlayer?' • FIRST!':'');$('#reveal').classList.add('on');setTimeout(()=>{if(rar==='rare'||rar==='legendary')showPayoff(rar,{index:current});else checkRewards()},650);if(navigator.vibrate)navigator.vibrate([60,40,120]);confetti()}
$('#openBook').onclick=()=>{$('#reveal').classList.remove('on');openBook()};$('#keepHunting').onclick=()=>{$('#reveal').classList.remove('on');next(1)};
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1500)} function confetti(){for(let i=0;i<24;i++){let n=document.createElement('i');n.textContent=['✦','●','◆'][i%3];n.style.cssText='position:fixed;z-index:90;left:'+(40+Math.random()*20)+'%;top:45%;color:'+palette[i%palette.length]+';font-size:'+(12+Math.random()*15)+'px;transition:1s cubic-bezier(.1,.7,.2,1)';document.body.appendChild(n);requestAnimationFrame(()=>{n.style.transform='translate('+(Math.random()*400-200)+'px,'+(Math.random()*500-250)+'px) rotate(500deg)';n.style.opacity=0});setTimeout(()=>n.remove(),1100)}}
$('#payoffDone').onclick=()=>{$('#payoff').classList.remove('on');renderProgress()};renderProgress();current=0;render();renderBook();

/* Tiny responsive toys: locks protest, controls spring, and foil follows the phone. */
document.addEventListener('pointerdown',e=>{let lock=e.target.closest('.lockedCard,.packTile.locked,.packChip.locked,.lockedPiece,.setReward.locked')?.querySelector('.lockBadge');if(lock){lock.classList.remove('lockJiggle');void lock.offsetWidth;lock.classList.add('lockJiggle');if(navigator.vibrate)navigator.vibrate(7)}});
let orientEnabled=false;function enableOrientation(){if(orientEnabled)return;let go=()=>{window.addEventListener('deviceorientation',e=>{if(drag||!e.gamma&&!e.beta)return;let c=$('.card.rare,.card.legendary');if(!c)return;let dx=Math.max(-45,Math.min(45,e.gamma||0))*2,dy=Math.max(-30,Math.min(30,(e.beta||0)-45))*1.4;setCardTilt(c,dx,dy,false)}, {passive:true});orientEnabled=true};if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(x=>{if(x==='granted')go()}).catch(()=>{})}else go()}
document.addEventListener('pointerup',e=>{if(e.target.closest('#go,.card,.slot.holo,.revealCard'))enableOrientation()},{once:true});

const preview=new URLSearchParams(location.hash.slice(1)).get('preview');if(preview==='book')openBook();if(preview==='back')setTimeout(()=>$('.card').classList.add('flipped'),100);if(preview==='unlock'){state.unlockedPacks=2;LIVE=new Set(liveList());renderProgress();setTimeout(()=>showPayoff('pack',PACKS[1]),250)}if(preview==='rare'){state.unlockedPacks=4;LIVE=new Set(liveList());current=49;$('#home').classList.add('gone');render();setTimeout(()=>showPayoff('legendary',{index:49}),450)}if(preview==='holo'){setTimeout(()=>showPayoff('holo',{name:'POLLINATORS'}),300)}if(preview==='found'){state.books.Reece[0]={at:Date.now(),photo:ART_IMAGES[0],approvedBy:'Michael'};state.first[0]='Reece';current=0;render()}if(preview==='foil'){state.unlockedPacks=4;LIVE=new Set(liveList());state.books.Reece[49]={at:Date.now(),photo:ART_IMAGES[49],approvedBy:'Michael'};state.first[49]='Reece';current=49;$('#home').classList.add('gone');$('#game').classList.add('started');render()}
</script></body></html>
